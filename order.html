<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — ดอกบัวคี่</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">ดอกบัวคี่</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="divider">
        <p class="lead">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
      </div>
    </section>

    <section class="section section--white">
      <div class="container">
        <form id="orderForm" class="form-panel">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ <span class="field__optional">(ไม่บังคับ)</span></label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--gold">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© ดอกบัวคี่</span>
      <a href="product.html">กลับไปเลือกสินค้า</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
